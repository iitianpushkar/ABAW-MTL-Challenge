[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "abaw-mtl"
version = "0.1.0"
description = "ABAW affective behaviour analysis research baseline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.2",
  "pyyaml>=6.0",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "tqdm>=4.66",
  "transformers>=4.45,<6",
]

[project.scripts]
abaw-smoke = "abaw.smoke_test:main"
abaw-train = "abaw.train:main"

[tool.setuptools.packages.find]
where = ["src"]
